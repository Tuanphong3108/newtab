<!DOCTYPE html>
<html lang="vi">
<head>
  <meta name="google" content="notranslate">
  <meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400;500;600&display=swap" rel="stylesheet">
  <title>New Tab</title>

  <!-- service worker -->
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js");
    }
  </script>

  <style>
@font-face {
    font-family: 'Minecraft';
    src: url('https://tuanphong3108.github.io/google-sans-do-not-access/minecraft.ttf') format('truetype');
    }

@font-face {
  font-family: 'LF Minecraft Ten';
  src: url('https://tuanphong3108.github.io/google-sans-do-not-access/LF%20Minecraft%20Ten.ttf') format('truetype');
}

   html { overflow: hidden; }

   body {
      margin: 0;
      padding: 0;
      font-family: 'Minecraft', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      user-select: none;
      position: relative;
      transition: background-color 0.5s, color 0.5s;
      background-color: #000;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }


    body.dark {
      background-color: #202020;
      color: #fff;
    }

    body.light {
      background-color: #202020;
      color: #fff;
    }

#clock {
  font-size: 64px;
  text-shadow: 2px 2px #000;

  position: relative;
  z-index: 10;

  font-family: 'LF Minecraft Ten', monospace;
  font-variant-numeric: tabular-nums;
  will-change: transform;
}

    #clock.tick {
  animation: tickZoom 0.2s ease;
}

@keyframes tickZoom {
  0%   { transform: scale(1); }
  50%  { transform: scale(1.12); }
  100% { transform: scale(1); }
}


    #date {
  font-size: 24px;
  margin-top: 10px;
  font-family: 'LF Minecraft Ten', monospace;
}

    .xp-bar {
      width: 300px;
      height: 10px;
      background-color: #444;
      border: 2px solid #000;
      margin-top: 20px;
      position: relative;
    }

    .xp-fill {
      height: 100%;
      background-color: #3ADF00;
      width: 50%;
    }

    .quote {
      margin-top: 20px;
      font-size: 16px;
      opacity: 0.75;
      text-align: center;
      max-width: 80%;
    }


.google-news-btn {
  position: fixed;
  bottom: 12px;
  right: 12px;

  display: flex;
  align-items: center;
  gap: 6px;

  padding: 6px 12px;
  font-size: 12px;

  color: #fff;

  /* nền gốc: đen */
  background: rgba(0, 0, 0, 0.45);

  border-radius: 10px;
  text-decoration: none;
  z-index: 9999;

  /* mượt từ từ */
  transition:
    transform 0.25s ease,
    box-shadow 0.25s ease,
    background-color 0.3s ease,
    background-position 0.6s ease;
}

/* 🌈 gradient Google (để sẵn, nhưng chưa hiện) */
.google-news-btn::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;

  background: linear-gradient(
    135deg,
    #ea4335,
    #fbbc05,
    #34a853,
    #4285f4
  );
  background-size: 300% 300%;

  opacity: 0;
  transition: opacity 0.3s ease;

  z-index: -1;
}

/* 🚀 hover = nổi + fade sang gradient + gradient chuyển động */
.google-news-btn:hover {
  transform: translateY(-4px);
  box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
}

.google-news-btn:hover::before {
  opacity: 1;
  animation: googleGradientMove 3s ease infinite;
}

/* icon outline → fill */
.google-news-btn:hover .material-symbols-outlined {
  font-variation-settings:
    'FILL' 1,
    'wght' 400,
    'GRAD' 0,
    'opsz' 20;
}

@keyframes googleGradientMove {
  0% {
    background-position: 0% 50%;
  }
  50% {
    background-position: 100% 50%;
  }
  100% {
    background-position: 0% 50%;
  }
}

/* ===== GOOGLE SEARCH BAR ===== */
#google-search {
  position: relative;
  width: 360px;
  margin: 24px auto 0;
}

/* input */
#search-input {
  width: 100%;
  padding: 12px 76px 12px 16px;
  border-radius: 14px;
  border: none;
  outline: none;

  background: rgba(0, 0, 0, 0.45);
  color: #fff;
  font-size: 14px;
}

#search-input::placeholder {
  color: rgba(255, 255, 255, 0.6);
}

/* nút search & image search */
#search-btn,
#image-search-btn {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);

  background: none;
  border: none;
  color: #fff;
  cursor: pointer;
  padding: 4px;
}

#search-btn {
  right: 10px;
}

#image-search-btn {
  right: 38px;
}

#search-btn .material-symbols-outlined,
#image-search-btn .material-symbols-outlined {
  font-size: 20px;
}

/* ===== SUGGEST DROPDOWN ===== */
#suggestions {
  position: absolute;
  top: 100%;
  left: 0;
  right: 0;
  z-index: 50;
  max-height: min(320px, 40vh);
  overflow-y: auto;
  list-style: none;
  margin: 8px 0 0;
  padding: 0;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);

  background: rgba(0, 0, 0, 0.6);
  border-radius: 12px;
  overflow: hidden;

  opacity: 0;
  transform: translateY(-6px) scale(0.98);
  pointer-events: none;
  transition: 0.2s ease;
}

#suggestions.show {
  opacity: 1;
  transform: translateY(0) scale(1);
  pointer-events: auto;
}

#suggestions li {
  padding: 10px 16px;
  font-size: 13px;
  cursor: pointer;
  animation: fadeInItem 0.15s ease;
}

#suggestions li:hover,
#suggestions li.active {
  background: rgba(255, 255, 255, 0.12);
}

/* animation item */
@keyframes fadeInItem {
  from {
    opacity: 0;
    transform: translateY(-4px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.weather-btn {
  position: fixed;
  bottom: 20px;
  left: 20px;

  display: inline-flex;
  align-items: center;
  gap: 8px;

  padding: 10px 14px;
  border-radius: 14px;

  background: rgba(0, 0, 0, 0.55);
  color: #fff;
  text-decoration: none !important;

  font-size: 13px;
  font-family: inherit;

  backdrop-filter: blur(10px);
  cursor: pointer;

  z-index: 5;
}


.weather-btn .material-symbols-outlined {
  font-size: 20px;
  line-height: 1;
}


.weather-btn:hover {
  transform: translateY(-3px);
  box-shadow: 0 10px 24px rgba(0, 0, 0, 0.35);
}


/* ===== BACKGROUND BASE (ảnh đang hiển thị) ===== */
#bg-base {
  position: fixed;
  inset: 0;

  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;

  z-index: 0;
}

/* ===== BACKGROUND FADE (ảnh mới fade-in đè lên) ===== */
#bg-fade {
  position: fixed;
  inset: 0;

  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;

  opacity: 0;
  transition: opacity 3s ease; /* fade-in chậm hơn ở đây 👈 */

  z-index: 1;
}

/* ===== LỚP PHỦ TỐI (LUÔN Ở TRÊN NỀN) ===== */
body::before {
  content: "";
  position: fixed;
  inset: 0;

  background: rgba(0, 0, 0, 0.35);

  z-index: 2;
  pointer-events: none; /* ⭐ CỨU MẠNG */
}


/* ===== UI / CONTENT (SEARCH, BUTTON, CLOCK...) ===== */
.ui,
.container,
main {
  position: relative;
  z-index: 3;
}

#clock,
#date,
.xp-bar,
.quote,
#google-search {
  position: relative;
  z-index: 5;
}

/* ===== APPS BUTTON ===== */
#apps-btn {
  position: fixed;
  top: 16px;      /* 👈 đổi từ bottom */
  right: 16px;    /* giữ nguyên */

  display: flex;
  align-items: center;
  gap: 8px;

  padding: 10px 14px;
  border-radius: 14px;

  background: rgba(0, 0, 0, 0.55);
  color: #fff;
  border: none;
  cursor: pointer;

  font-size: 13px;
  z-index: 10000; /* 👈 tăng nhẹ cho chắc, đè mọi overlay */

  backdrop-filter: blur(10px);
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

#apps-btn:hover {
  transform: translateY(-3px);
  box-shadow: 0 10px 24px rgba(0, 0, 0, 0.35);
}

#apps-btn .material-symbols-outlined {
  font-size: 20px;
}

/* ===== OVERLAY ===== */
#apps-overlay {
  position: fixed;
  inset: 0;

  background: rgba(0, 0, 0, 0.6);
  backdrop-filter: blur(6px);

  display: flex;
  align-items: center;
  justify-content: center;

  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease;

  z-index: 20;
}

#apps-overlay.show {
  opacity: 1;
  pointer-events: auto;
}

/* ===== DIALOG ===== */
.apps-dialog {
  position: relative;
  width: 90%;
  max-width: 1000px;
  height: 80%;

  background: #111;
  border-radius: 18px;
  overflow: hidden;

  box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
  animation: dialogPop 0.25s ease;
}

@keyframes dialogPop {
  from {
    transform: scale(0.96);
    opacity: 0;
  }
  to {
    transform: scale(1);
    opacity: 1;
  }
}

/* iframe */
.apps-dialog iframe {
  width: 100%;
  height: 100%;
  border: none;
}

/* ===== CLOSE BUTTON ===== */
#apps-close {
  position: absolute;
  top: 10px;
  right: 10px;

  width: 34px;
  height: 34px;
  border-radius: 50%;

  border: none;
  background: rgba(0, 0, 0, 0.6);
  color: #fff;
  font-size: 18px;

  cursor: pointer;
  z-index: 2;

  transition: background 0.2s ease, transform 0.2s ease;
}

#apps-close:hover {
  background: rgba(255, 255, 255, 0.15);
  transform: rotate(90deg);
}

/* ===== BOOKMARK BUTTON (chỉ hiện khi ?extension=true) ===== */
#bookmark-btn {
  position: fixed;
  top: 16px;
  right: 130px; /* nằm bên trái nút Apps */

  display: none; /* Mặc định ẩn, chỉ hiện qua JS khi extension mode */
  align-items: center;
  gap: 8px;

  padding: 10px 14px;
  border-radius: 14px;

  background: rgba(0, 0, 0, 0.55);
  color: #fff;
  border: none;
  cursor: pointer;

  font-size: 13px;
  z-index: 10000;

  backdrop-filter: blur(10px);
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

#bookmark-btn.show-ext {
  display: flex;
}

#bookmark-btn:hover {
  transform: translateY(-3px);
  box-shadow: 0 10px 24px rgba(0, 0, 0, 0.35);
}

#bookmark-btn .material-symbols-outlined {
  font-size: 20px;
}

/* ===== BOOKMARK PANEL (trượt từ phải, nền blur) ===== */
#bookmark-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.35);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease;
  z-index: 20001;
}

#bookmark-backdrop.show {
  opacity: 1;
  pointer-events: auto;
}

#bookmark-panel {
  position: fixed;
  top: 0;
  right: 0;
  height: 100%;
  width: 340px;
  max-width: 85vw;

  background: rgba(24, 24, 28, 0.92);
  color: #fff;
  box-shadow: -20px 0 60px rgba(0, 0, 0, 0.5);

  transform: translateX(100%);
  transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);

  z-index: 20002;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

#bookmark-panel.show {
  transform: translateX(0);
}

#bookmark-panel-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 18px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.1);
  flex-shrink: 0;
}

#bookmark-panel-header h3 {
  margin: 0;
  font-size: 18px;
  font-weight: 400;
  font-family: 'LF Minecraft Ten', monospace;
}

/* ===== THANH TÌM KIẾM TRONG PANEL BOOKMARK ===== */
#bookmark-search-wrap {
  position: relative;
  padding: 10px 12px 6px;
  flex-shrink: 0;
}

#bookmark-search-input {
  width: 100%;
  box-sizing: border-box;
  padding: 10px 36px 10px 38px;
  border: none;
  outline: none;
  border-radius: 12px;
  background: rgba(255, 255, 255, 0.1);
  color: #fff;
  font-size: 13.5px;
  font-family: inherit;
  transition: background 0.2s ease, box-shadow 0.2s ease;
}

#bookmark-search-input::placeholder {
  color: rgba(255, 255, 255, 0.55);
}

#bookmark-search-input:focus {
  background: rgba(255, 255, 255, 0.16);
  box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.18);
}

#bookmark-search-icon {
  position: absolute;
  left: 24px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 18px;
  opacity: 0.7;
  pointer-events: none;
  margin-top: 2px;
}

#bookmark-search-clear {
  position: absolute;
  right: 20px;
  top: 50%;
  transform: translateY(-50%);
  margin-top: 2px;
  display: none;
  align-items: center;
  justify-content: center;
  background: none;
  border: none;
  color: #fff;
  opacity: 0.7;
  cursor: pointer;
  padding: 2px;
}

#bookmark-search-clear.show { display: flex; }
#bookmark-search-clear:hover { opacity: 1; }
#bookmark-search-clear .material-symbols-outlined { font-size: 18px; }

.bm-link .bm-path {
  margin-left: auto;
  padding-left: 8px;
  font-size: 11px;
  opacity: 0.45;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  max-width: 40%;
}

#bookmark-panel-close {
  background: rgba(255, 255, 255, 0.08);
  border: none;
  color: #fff;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.2s ease, transform 0.2s ease;
}

#bookmark-panel-close:hover {
  background: rgba(255, 255, 255, 0.18);
  transform: rotate(90deg);
}

#bookmark-panel-header-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

#bookmark-add-btn {
  background: rgba(255, 255, 255, 0.1);
  border: none;
  color: #fff;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.2s ease, transform 0.2s ease;
}

#bookmark-add-btn:hover {
  background: rgba(255, 255, 255, 0.2);
  transform: scale(1.08);
}

#bookmark-add-btn .material-symbols-outlined {
  font-size: 18px;
}

#bookmark-panel-body {
  flex: 1;
  overflow-y: auto;
  padding: 8px 8px 24px;
}

#bookmark-panel-body::-webkit-scrollbar {
  width: 6px;
}

#bookmark-panel-body::-webkit-scrollbar-thumb {
  background: rgba(255, 255, 255, 0.15);
  border-radius: 3px;
}

.bm-folder > summary {
  list-style: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 10px;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 500;
  transition: background 0.15s ease;
}

.bm-folder > summary::-webkit-details-marker {
  display: none;
}

.bm-folder > summary:hover {
  background: rgba(255, 255, 255, 0.08);
}

.bm-folder[open] > summary .material-symbols-outlined.bm-caret {
  transform: rotate(90deg);
}

.bm-caret {
  font-size: 18px;
  transition: transform 0.15s ease;
}

.bm-icon {
  font-size: 18px;
  opacity: 0.85;
}

.bm-children {
  padding-left: 18px;
  border-left: 1px dashed rgba(255, 255, 255, 0.12);
  margin-left: 12px;
}

.bm-link {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 10px;
  border-radius: 10px;
  font-size: 13.5px;
  color: #dfe3ff;
  text-decoration: none;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  transition: background 0.15s ease;
  cursor: pointer;
}

.bm-link:hover {
  background: rgba(255, 255, 255, 0.08);
}

.bm-link .bm-favicon {
  width: 16px;
  height: 16px;
  flex-shrink: 0;
  border-radius: 3px;
  object-fit: contain;
}

.bm-link .bm-favicon.bm-hide {
  display: none;
}

.bm-link .bm-text {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.bm-empty, .bm-loading, .bm-error {
  padding: 20px 14px;
  opacity: 0.7;
  font-size: 13.5px;
  text-align: center;
}

/* ===== MENU CHUỘT PHẢI (giống context menu bookmark của Chrome) ===== */
.bm-context-menu {
  position: fixed;
  z-index: 99999;
  min-width: 230px;
  background: #fff;
  color: #202124;
  border-radius: 10px;
  box-shadow: 0 8px 28px rgba(0, 0, 0, 0.3);
  padding: 6px 0;
  display: none;
  font-size: 13.5px;
  font-family: 'Google Sans Flex', 'Segoe UI', Roboto, Arial, sans-serif;
}

.bm-context-menu.show {
  display: block;
}

.bm-context-menu button {
  display: block;
  width: 100%;
  text-align: left;
  padding: 9px 18px;
  background: none;
  border: none;
  cursor: pointer;
  color: inherit;
  font: inherit;
}

.bm-context-menu button:hover {
  background: rgba(0, 0, 0, 0.06);
}

.bm-context-menu button.bm-danger {
  color: #b3261e;
}

.bm-context-menu hr {
  margin: 6px 0;
  border: none;
  border-top: 1px solid rgba(0, 0, 0, 0.08);
}

/* Khi target là thư mục (không có URL): ẩn các mục mở tab/window/ẩn danh */
.bm-context-menu.bm-target-folder .bm-link-only {
  display: none;
}

/* ===== MODAL THÊM / SỬA BOOKMARK ===== */
.bm-modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.5);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 100000;
}

.bm-modal-backdrop.show {
  display: flex;
}

.bm-modal {
  width: 340px;
  max-width: 90vw;
  background: rgba(28, 27, 31, 0.97);
  color: #fff;
  border-radius: 16px;
  padding: 20px;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
  animation: bmModalPop 0.2s ease;
}

@keyframes bmModalPop {
  from { opacity: 0; transform: translateY(12px) scale(0.97); }
  to { opacity: 1; transform: none; }
}

.bm-modal h4 {
  margin: 0 0 16px;
  font-size: 16px;
  font-weight: 600;
}

.bm-modal label {
  display: block;
  font-size: 12.5px;
  opacity: 0.75;
  margin: 12px 0 6px;
}

.bm-modal input[type="text"],
.bm-modal select {
  width: 100%;
  box-sizing: border-box;
  padding: 9px 12px;
  border-radius: 10px;
  border: 1px solid rgba(255, 255, 255, 0.15);
  background: rgba(255, 255, 255, 0.06);
  color: #fff;
  font-size: 13.5px;
  outline: none;
}

.bm-modal input[type="text"]:focus,
.bm-modal select:focus {
  border-color: rgba(255, 255, 255, 0.4);
}

.bm-modal select option {
  background: #222;
  color: #fff;
}

.bm-modal-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 20px;
}

.bm-modal-actions button {
  padding: 8px 16px;
  border-radius: 10px;
  border: none;
  cursor: pointer;
  font-size: 13px;
  font-weight: 500;
}

#bm-modal-cancel {
  background: rgba(255, 255, 255, 0.1);
  color: #fff;
}

#bm-modal-cancel:hover {
  background: rgba(255, 255, 255, 0.18);
}

#bm-modal-save {
  background: #8ab4ff;
  color: #10131a;
}

#bm-modal-save:hover {
  background: #a4c4ff;
}

/* ===== DOCK "Mở Chrome Apps" (chỉ hiện trong Apps dialog khi extension mode) ===== */
#apps-dock {
  position: absolute;
  left: 50%;
  bottom: 18px;
  transform: translateX(-50%);

  display: none;
  align-items: center;
  gap: 8px;

  padding: 10px 16px;
  border-radius: 14px;

  background: rgba(0, 0, 0, 0.6);
  color: #fff;
  border: 1px solid rgba(255, 255, 255, 0.12);
  cursor: pointer;

  font-size: 13px;
  z-index: 3;

  backdrop-filter: blur(10px);
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

#apps-dock.show-ext {
  display: flex;
}

#apps-dock:hover {
  transform: translateX(-50%) translateY(-3px);
  box-shadow: 0 10px 24px rgba(0, 0, 0, 0.35);
}

#apps-dock .material-symbols-outlined {
  font-size: 20px;
}

<script>
const form = document.getElementById("google-search");
const input = document.getElementById("search-input");
const list  = document.getElementById("suggestions");
const imageBtn = document.getElementById("image-search-btn");

/* điều hướng: extension → mở tab mới + đóng tab hiện tại; thường → chuyển trang */
function goTo(url) {
  if (isExtensionMode) {
    window.open(url, "_blank", "noopener,noreferrer");
    window.parent.postMessage("CLOSE_NEW_TAB", "*");
  } else {
    window.location.href = url;
  }
}

function doSearch(q) {
  q = (q || "").trim();
  if (!q) return;
  goTo("https://www.google.com/search?q=" + encodeURIComponent(q));
}

/* submit search */
form.addEventListener("submit", e => {
  e.preventDefault();
  doSearch(input.value);
});

/* google suggest */
let suggestTimer = null;
let suggestSeq = 0;
let activeIdx = -1;

function hideSuggest() {
  list.classList.remove("show");
  activeIdx = -1;
}

function setActive(i) {
  const items = list.querySelectorAll("li");
  items.forEach(li => li.classList.remove("active"));
  activeIdx = i;
  if (i >= 0 && items[i]) {
    items[i].classList.add("active");
    // cuộn riêng trong danh sách gợi ý, KHÔNG dùng scrollIntoView (nó có thể cuộn cả trang làm ô tìm kiếm trượt mất)
    const li = items[i];
    if (li.offsetTop < list.scrollTop) list.scrollTop = li.offsetTop;
    else if (li.offsetTop + li.offsetHeight > list.scrollTop + list.clientHeight)
      list.scrollTop = li.offsetTop + li.offsetHeight - list.clientHeight;
  }
}

function renderSuggest(items) {
  list.innerHTML = "";
  activeIdx = -1;
  if (!items.length) { hideSuggest(); return; }

  items.forEach(text => {
    const li = document.createElement("li");
    li.textContent = text;
    // dùng mousedown để chạy trước khi input mất focus
    li.addEventListener("mousedown", e => {
      e.preventDefault();
      input.value = text;
      hideSuggest();
      doSearch(text); // extension: mở tab mới + đóng tab hiện tại
    });
    list.appendChild(li);
  });
  list.classList.add("show");
}

async function fetchSuggest(q) {
  const seq = ++suggestSeq;
  try {
    const r = await fetch(
      "https://suggestqueries.google.com/complete/search?client=firefox&hl=vi&q=" +
        encodeURIComponent(q)
    );
    const data = await r.json();
    if (seq !== suggestSeq) return; // bỏ kết quả cũ
    renderSuggest((data && data[1]) || []);
  } catch (err) {
    if (seq === suggestSeq) hideSuggest();
  }
}

input.addEventListener("input", () => {
  const q = input.value.trim();
  clearTimeout(suggestTimer);
  if (!q) {
    suggestSeq++;
    list.innerHTML = "";
    hideSuggest();
    return;
  }
  suggestTimer = setTimeout(() => fetchSuggest(q), 120);
});

input.addEventListener("focus", () => {
  if (list.children.length) list.classList.add("show");
});

/* điều hướng gợi ý bằng bàn phím */
input.addEventListener("keydown", e => {
  const items = list.querySelectorAll("li");
  if (!items.length || !list.classList.contains("show")) return;

  if (e.key === "ArrowDown") {
    e.preventDefault();
    setActive((activeIdx + 1) % items.length);
    input.value = items[activeIdx].textContent;
  } else if (e.key === "ArrowUp") {
    e.preventDefault();
    setActive((activeIdx - 1 + items.length) % items.length);
    input.value = items[activeIdx].textContent;
  } else if (e.key === "Escape") {
    hideSuggest();
  }
});

/* click image search → Google Lens */
imageBtn.addEventListener("click", () => {
  goTo("https://lens.google.com");
});

/* click ngoài → đóng suggest */
document.addEventListener("click", e => {
  if (!form.contains(e.target)) {
    list.classList.remove("show");
  }
});
</script>

<script>
/**
 * ===== TÍNH NĂNG BOOKMARK (chỉ hoạt động khi ?extension=true) =====
 * - Nút Bookmark -> mở panel bên phải, nền blur, hiển thị cây thư mục bookmark
 * - Nút "+" -> thêm bookmark mới
 * - Chuột phải vào bookmark/thư mục -> menu: mở tab mới / cửa sổ mới / ẩn danh,
 *   chỉnh sửa, chuyển thư mục, xoá
 * - Click trái vào bookmark -> gửi yêu cầu ghi đè URL tab hiện tại (không mở tab mới)
 * - Ưu tiên hiện favicon thật, nếu lỗi thì rơi về icon liên kết mặc định
 * - Dock "Mở Chrome Apps" trong dialog Apps -> yêu cầu extension ghi đè
 *   tab hiện tại thành chrome://apps
 */

const bookmarkBtn = document.getElementById("bookmark-btn");
const bookmarkBackdrop = document.getElementById("bookmark-backdrop");
const bookmarkPanel = document.getElementById("bookmark-panel");
const bookmarkPanelClose = document.getElementById("bookmark-panel-close");
const bookmarkPanelBody = document.getElementById("bookmark-panel-body");
const bookmarkAddBtn = document.getElementById("bookmark-add-btn");
const appsDock = document.getElementById("apps-dock");

const bmContextMenu = document.getElementById("bm-context-menu");
const bmModalBackdrop = document.getElementById("bm-modal-backdrop");
const bmModalTitle = document.getElementById("bm-modal-title");
const bmModalName = document.getElementById("bm-modal-name");
const bmModalUrl = document.getElementById("bm-modal-url");
const bmModalUrlLabel = document.getElementById("bm-modal-url-label");
const bmModalFolder = document.getElementById("bm-modal-folder");
const bmModalFolderLabel = document.getElementById("bm-modal-folder-label");
const bmModalCancel = document.getElementById("bm-modal-cancel");
const bmModalSave = document.getElementById("bm-modal-save");

let bookmarksLoaded = false;
let bmLastTree = null;       // cây bookmark mới nhất nhận được
let bmExtensionId = null;    // extensionId để dựng URL favicon
let bmContextTarget = null;  // { id, url, isFolder } của item đang bị chuột phải
let bmModalMode = null;      // "add" | "edit"
let bmModalTargetId = null;

/* ===== KÊNH GIAO TIẾP VỚI EXTENSION (qua newtab.js) ===== */
let bmReqCounter = 0;
const bmPending = new Map();

function bmSendCmd(action, payload) {
  return new Promise((resolve) => {
    const reqId = ++bmReqCounter;
    bmPending.set(reqId, resolve);
    window.parent.postMessage({ type: "BOOKMARK_CMD", reqId, action, payload }, "*");
  });
}

window.addEventListener("message", (event) => {
  if (event.data && event.data.type === "BOOKMARK_CMD_RESULT") {
    const resolve = bmPending.get(event.data.reqId);
    if (resolve) {
      bmPending.delete(event.data.reqId);
      resolve(event.data.response);
    }
  }
});

/* ===== MỞ / ĐÓNG PANEL ===== */
function openBookmarkPanel() {
  bookmarkBackdrop.classList.add("show");
  bookmarkPanel.classList.add("show");
  setTimeout(() => { const i = document.getElementById("bookmark-search-input"); if (i) i.focus(); }, 320);
  if (!bookmarksLoaded) {
    loadBookmarks();
  }
}

function closeBookmarkPanel() {
  bookmarkBackdrop.classList.remove("show");
  bookmarkPanel.classList.remove("show");
}

async function loadBookmarks() {
  bookmarkPanelBody.innerHTML = `<div class="bm-loading">Đang tải bookmark...</div>`;
  const response = await bmSendCmd("GET_BOOKMARKS");
  if (response && response.success) {
    bookmarksLoaded = true;
    bmLastTree = response.tree;
    bmExtensionId = response.extensionId || bmExtensionId;
    renderBookmarkTree(bmLastTree);
  } else {
    bookmarkPanelBody.innerHTML = `<div class="bm-error">Không thể tải bookmark${response && response.error ? ": " + response.error : ""}.</div>`;
  }
}

/* ===== ICON / FAVICON ===== */
function bmIcon(name, extraClass) {
  const span = document.createElement("span");
  span.className = "material-symbols-outlined bm-icon" + (extraClass ? " " + extraClass : "");
  span.textContent = name;
  return span;
}

// Ưu tiên favicon thật của trang; nếu lỗi thì hiện icon liên kết mặc định
function bmBuildFavicon(url) {
  const wrap = document.createElement("span");
  wrap.style.display = "inline-flex";
  wrap.style.flexShrink = "0";

  const fallback = bmIcon("link");
  fallback.classList.add("bm-favicon-fallback");

  if (bmExtensionId) {
    const img = document.createElement("img");
    img.className = "bm-favicon";
    img.src = `chrome-extension://${bmExtensionId}/_favicon/?pageUrl=${encodeURIComponent(url)}&size=32`;
    img.alt = "";
    img.onerror = () => {
      img.classList.add("bm-hide");
      wrap.appendChild(fallback);
    };
    wrap.appendChild(img);
  } else {
    wrap.appendChild(fallback);
  }
  return wrap;
}

/* ===== DỰNG CÂY BOOKMARK ===== */
function renderBookmarkNode(node) {
  // Node là 1 bookmark (có url)
  if (node.url) {
    const a = document.createElement("a");
    a.className = "bm-link";
    a.href = node.url;
    a.title = node.title || node.url;
    a.dataset.id = node.id;
    a.dataset.url = node.url;

    a.appendChild(bmBuildFavicon(node.url));
    const text = document.createElement("span");
    text.className = "bm-text";
    text.textContent = node.title || node.url;
    a.appendChild(text);

    // Click trái: KHÔNG mở tab mới, gửi yêu cầu ghi đè URL tab hiện tại
    a.addEventListener("click", (e) => {
      e.preventDefault();
      bmSendCmd("OPEN_URL_IN_TAB", { url: node.url });
    });

    // Chuột phải: menu tuỳ chỉnh
    a.addEventListener("contextmenu", (e) => {
      e.preventDefault();
      bmOpenContextMenu(e.clientX, e.clientY, { id: node.id, url: node.url, title: node.title, isFolder: false });
    });

    return a;
  }

  // Node là 1 thư mục
  const details = document.createElement("details");
  details.className = "bm-folder";
  details.dataset.id = node.id;

  const summary = document.createElement("summary");
  summary.appendChild(bmIcon("chevron_right", "bm-caret"));
  summary.appendChild(bmIcon("folder"));
  const label = document.createElement("span");
  label.textContent = node.title || "Bookmarks";
  summary.appendChild(label);
  details.appendChild(summary);

  // Chuột phải vào thư mục (trừ các thư mục gốc id 0/1/2/3 không cho sửa/xoá)
  const isRootFolder = ["0", "1", "2", "3"].includes(String(node.id)) && !node.parentId;
  if (!isRootFolder) {
    summary.addEventListener("contextmenu", (e) => {
      e.preventDefault();
      e.stopPropagation();
      bmOpenContextMenu(e.clientX, e.clientY, { id: node.id, title: node.title, isFolder: true });
    });
  }

  const childrenWrap = document.createElement("div");
  childrenWrap.className = "bm-children";

  if (node.children && node.children.length) {
    node.children.forEach(child => {
      childrenWrap.appendChild(renderBookmarkNode(child));
    });
  } else {
    const empty = document.createElement("div");
    empty.className = "bm-empty";
    empty.textContent = "Trống";
    childrenWrap.appendChild(empty);
  }

  details.appendChild(childrenWrap);
  return details;
}

/* ===== TÌM KIẾM BOOKMARK ===== */
const bmSearchInput = document.getElementById("bookmark-search-input");
const bmSearchClear = document.getElementById("bookmark-search-clear");

function bmNormalize(str) {
  return (str || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/đ/g, "d");
}

// Gom tất cả bookmark (có url) khớp từ khoá, kèm đường dẫn thư mục
function bmSearchCollect(nodes, terms, path, out) {
  (nodes || []).forEach(node => {
    if (node.url) {
      const hay = bmNormalize((node.title || "") + " " + node.url);
      if (terms.every(t => hay.includes(t))) out.push({ node, path: path.join(" / ") });
    } else if (node.children) {
      const name = node.title || "";
      bmSearchCollect(node.children, terms, name ? path.concat(name) : path, out);
    }
  });
}

function renderBookmarkSearchResults(query) {
  const terms = bmNormalize(query).split(/\s+/).filter(Boolean);
  const topLevel = bmLastTree && bmLastTree[0] && bmLastTree[0].children ? bmLastTree[0].children : (bmLastTree || []);
  const results = [];
  bmSearchCollect(topLevel, terms, [], results);

  bookmarkPanelBody.innerHTML = "";
  if (!results.length) {
    bookmarkPanelBody.innerHTML = `<div class="bm-empty">Không tìm thấy bookmark nào.</div>`;
    return;
  }
  results.forEach(({ node, path }) => {
    const el = renderBookmarkNode(node);
    if (path) {
      const p = document.createElement("span");
      p.className = "bm-path";
      p.textContent = path;
      el.appendChild(p);
    }
    bookmarkPanelBody.appendChild(el);
  });
}

function bmApplySearch() {
  const q = bmSearchInput ? bmSearchInput.value.trim() : "";
  if (bmSearchClear) bmSearchClear.classList.toggle("show", !!q);
  if (!bmLastTree) return;
  if (q) renderBookmarkSearchResults(q);
  else renderBookmarkTree(bmLastTree);
}

if (bmSearchInput) {
  bmSearchInput.addEventListener("input", bmApplySearch);
  bmSearchInput.addEventListener("keydown", e => {
    if (e.key === "Escape") {
      if (bmSearchInput.value) { bmSearchInput.value = ""; bmApplySearch(); }
      else closeBookmarkPanel();
    }
  });
}
if (bmSearchClear) {
  bmSearchClear.addEventListener("click", () => {
    bmSearchInput.value = "";
    bmApplySearch();
    bmSearchInput.focus();
  });
}

function renderBookmarkTree(rootNodes) {
  // Nếu đang tìm kiếm thì giữ kết quả lọc thay vì vẽ lại cả cây
  if (bmSearchInput && bmSearchInput.value.trim() && rootNodes === bmLastTree) {
    renderBookmarkSearchResults(bmSearchInput.value.trim());
    return;
  }
  bookmarkPanelBody.innerHTML = "";

  if (!rootNodes || !rootNodes.length) {
    bookmarkPanelBody.innerHTML = `<div class="bm-empty">Không có bookmark nào.</div>`;
    return;
  }

  // rootNodes[0] thường là node gốc ảo, con của nó mới là "Bookmark bar", "Other bookmarks",...
  const topLevelFolders = rootNodes[0] && rootNodes[0].children ? rootNodes[0].children : rootNodes;

  topLevelFolders.forEach((folder, idx) => {
    const el = renderBookmarkNode(folder);
    // Mở sẵn thư mục đầu tiên (thường là "Bookmarks bar") cho tiện nhìn
    if (idx === 0 && el.tagName === "DETAILS") el.open = true;
    bookmarkPanelBody.appendChild(el);
  });
}

/* ===== THU THẬP DANH SÁCH THƯ MỤC (dùng cho <select> chọn thư mục) ===== */
function bmCollectFolders(nodes, depth, out) {
  (nodes || []).forEach(node => {
    if (!node.url) { // là thư mục
      out.push({ id: node.id, title: node.title || "Bookmarks", depth });
      if (node.children) bmCollectFolders(node.children, depth + 1, out);
    }
  });
}

function bmPopulateFolderSelect(selectedId) {
  bmModalFolder.innerHTML = "";
  if (!bmLastTree) return;

  const topLevel = bmLastTree[0] && bmLastTree[0].children ? bmLastTree[0].children : bmLastTree;
  const folders = [];
  bmCollectFolders(topLevel, 0, folders);

  folders.forEach(f => {
    const opt = document.createElement("option");
    opt.value = f.id;
    opt.textContent = "\u00A0\u00A0".repeat(f.depth) + f.title;
    if (String(f.id) === String(selectedId)) opt.selected = true;
    bmModalFolder.appendChild(opt);
  });
}

function bmFindNodeById(nodes, id) {
  for (const node of (nodes || [])) {
    if (String(node.id) === String(id)) return node;
    if (node.children) {
      const found = bmFindNodeById(node.children, id);
      if (found) return found;
    }
  }
  return null;
}

/* ===== MENU CHUỘT PHẢI ===== */
function bmOpenContextMenu(x, y, target) {
  bmContextTarget = target;
  bmContextMenu.classList.toggle("bm-target-folder", !!target.isFolder);
  bmContextMenu.classList.add("show");

  // Đặt vị trí, tránh tràn ra ngoài màn hình
  const menuWidth = 240, menuHeight = 220;
  const posX = Math.min(x, window.innerWidth - menuWidth - 8);
  const posY = Math.min(y, window.innerHeight - menuHeight - 8);
  bmContextMenu.style.left = Math.max(8, posX) + "px";
  bmContextMenu.style.top = Math.max(8, posY) + "px";
}

function bmCloseContextMenu() {
  bmContextMenu.classList.remove("show");
}

document.addEventListener("click", (e) => {
  if (!bmContextMenu.contains(e.target)) bmCloseContextMenu();
});
window.addEventListener("blur", bmCloseContextMenu);

bmContextMenu.addEventListener("click", async (e) => {
  const btn = e.target.closest("button[data-action]");
  if (!btn || !bmContextTarget) return;
  const action = btn.dataset.action;
  const target = bmContextTarget;
  bmCloseContextMenu();

  switch (action) {
    case "open-new-tab":
      bmSendCmd("OPEN_NEW_TAB", { url: target.url });
      break;
    case "open-new-window":
      bmSendCmd("OPEN_NEW_WINDOW", { url: target.url });
      break;
    case "open-incognito":
      bmSendCmd("OPEN_INCOGNITO", { url: target.url });
      break;
    case "edit":
      bmOpenModal("edit", target);
      break;
    case "move":
      bmOpenModal("move", target);
      break;
    case "delete":
      if (confirm(`Xoá "${target.title || target.url}"?`)) {
        const res = await bmSendCmd("REMOVE_BOOKMARK", { id: target.id });
        if (res && res.success) loadBookmarksSilently();
        else alert("Không thể xoá: " + (res && res.error ? res.error : "Lỗi không xác định"));
      }
      break;
  }
});

async function loadBookmarksSilently() {
  const response = await bmSendCmd("GET_BOOKMARKS");
  if (response && response.success) {
    bmLastTree = response.tree;
    bmExtensionId = response.extensionId || bmExtensionId;
    renderBookmarkTree(bmLastTree);
  }
}

/* ===== MODAL THÊM / SỬA / DI CHUYỂN ===== */
function bmOpenModal(mode, target) {
  bmModalMode = mode;
  bmModalTargetId = target ? target.id : null;

  if (mode === "add") {
    bmModalTitle.textContent = "Thêm bookmark";
    bmModalName.value = "";
    bmModalUrl.value = "";
    bmModalUrl.style.display = "";
    bmModalUrlLabel.style.display = "";
    bmModalFolder.style.display = "";
    bmModalFolderLabel.style.display = "";
    bmPopulateFolderSelect(null);
  } else if (mode === "edit") {
    const node = bmFindNodeById(bmLastTree, target.id);
    bmModalTitle.textContent = target.isFolder ? "Đổi tên thư mục" : "Chỉnh sửa bookmark";
    bmModalName.value = (node && node.title) || target.title || "";
    if (target.isFolder) {
      bmModalUrl.style.display = "none";
      bmModalUrlLabel.style.display = "none";
    } else {
      bmModalUrl.style.display = "";
      bmModalUrlLabel.style.display = "";
      bmModalUrl.value = (node && node.url) || target.url || "";
    }
    bmModalFolder.style.display = "none";
    bmModalFolderLabel.style.display = "none";
  } else if (mode === "move") {
    bmModalTitle.textContent = "Chuyển đến thư mục khác";
    bmModalName.style.display = "none";
    document.querySelector('label[for="bm-modal-name"]').style.display = "none";
    bmModalUrl.style.display = "none";
    bmModalUrlLabel.style.display = "none";
    bmModalFolder.style.display = "";
    bmModalFolderLabel.style.display = "";
    bmPopulateFolderSelect(null);
  }

  bmModalBackdrop.classList.add("show");
}

function bmCloseModal() {
  bmModalBackdrop.classList.remove("show");
  bmModalMode = null;
  bmModalTargetId = null;
  // Khôi phục hiển thị mặc định cho lần mở sau
  bmModalName.style.display = "";
  document.querySelector('label[for="bm-modal-name"]').style.display = "";
}

bmModalCancel.addEventListener("click", bmCloseModal);
bmModalBackdrop.addEventListener("click", (e) => {
  if (e.target === bmModalBackdrop) bmCloseModal();
});

bmModalSave.addEventListener("click", async () => {
  if (bmModalMode === "add") {
    const title = bmModalName.value.trim();
    const url = bmModalUrl.value.trim();
    if (!title || !url) { alert("Vui lòng nhập đủ tên và URL."); return; }
    const parentId = bmModalFolder.value || undefined;
    const res = await bmSendCmd("CREATE_BOOKMARK", { title, url, parentId });
    if (res && res.success) { bmCloseModal(); loadBookmarksSilently(); }
    else alert("Không thể thêm bookmark: " + (res && res.error ? res.error : "Lỗi không xác định"));

  } else if (bmModalMode === "edit") {
    const title = bmModalName.value.trim();
    if (!title) { alert("Vui lòng nhập tên."); return; }
    const payload = { id: bmModalTargetId, title };
    if (bmModalUrl.style.display !== "none") {
      const url = bmModalUrl.value.trim();
      if (!url) { alert("Vui lòng nhập URL."); return; }
      payload.url = url;
    }
    const res = await bmSendCmd("UPDATE_BOOKMARK", payload);
    if (res && res.success) { bmCloseModal(); loadBookmarksSilently(); }
    else alert("Không thể lưu: " + (res && res.error ? res.error : "Lỗi không xác định"));

  } else if (bmModalMode === "move") {
    const parentId = bmModalFolder.value;
    const res = await bmSendCmd("MOVE_BOOKMARK", { id: bmModalTargetId, parentId });
    if (res && res.success) { bmCloseModal(); loadBookmarksSilently(); }
    else alert("Không thể chuyển: " + (res && res.error ? res.error : "Lỗi không xác định"));
  }
});

/* ===== GẮN SỰ KIỆN CHUNG ===== */
if (bookmarkBtn) bookmarkBtn.addEventListener("click", openBookmarkPanel);
if (bookmarkPanelClose) bookmarkPanelClose.addEventListener("click", closeBookmarkPanel);
if (bookmarkBackdrop) bookmarkBackdrop.addEventListener("click", closeBookmarkPanel);
if (bookmarkAddBtn) bookmarkAddBtn.addEventListener("click", () => bmOpenModal("add", null));

/* ===== CÁC TRANG THƯỜNG TRUY CẬP (lấy từ lịch sử duyệt web) ===== */
const frequentBox = document.getElementById("frequent-sites");
const frequentList = document.getElementById("frequent-list");

function freqBuildItem(site, extId) {
  const a = document.createElement("a");
  a.className = "freq-item";
  a.href = site.url;
  a.title = site.title + "\n" + site.url;

  const fallback = () => {
    const f = document.createElement("span");
    f.className = "freq-icon material-symbols-outlined";
    f.textContent = "language";
    return f;
  };

  if (extId) {
    const img = document.createElement("img");
    img.className = "freq-icon";
    img.alt = "";
    img.src = `chrome-extension://${extId}/_favicon/?pageUrl=${encodeURIComponent(site.url)}&size=64`;
    img.onerror = () => img.replaceWith(fallback());
    a.appendChild(img);
  } else {
    a.appendChild(fallback());
  }

  const name = document.createElement("span");
  name.className = "freq-name";
  name.textContent = site.title;
  a.appendChild(name);

  // Giống bookmark: ghi đè URL tab hiện tại
  a.addEventListener("click", (e) => {
    e.preventDefault();
    bmSendCmd("OPEN_URL_IN_TAB", { url: site.url });
  });
  return a;
}

async function loadFrequentSites() {
  if (!frequentBox) return;
  const res = await bmSendCmd("GET_FREQUENT_SITES", { limit: 7 });
  if (!res || !res.success || !res.sites || !res.sites.length) return;
  bmExtensionId = res.extensionId || bmExtensionId;
  frequentList.innerHTML = "";
  res.sites.forEach(site => frequentList.appendChild(freqBuildItem(site, res.extensionId)));
  frequentBox.classList.add("has-items");
}

// Chỉ hiện nút Bookmark + dock "Mở Chrome Apps" khi đang chạy trong extension
if (isExtensionMode) {
  if (bookmarkBtn) bookmarkBtn.classList.add("show-ext");
  if (frequentBox) { frequentBox.classList.add("show-ext"); loadFrequentSites(); }
  if (appsDock) {
    appsDock.classList.add("show-ext");
    appsDock.addEventListener("click", () => {
      console.log("Yêu cầu mở Chrome Apps...");
      window.parent.postMessage({ type: "OPEN_CHROME_APPS" }, "*");
    });
  }
}
</script>

<script>
  /**
   * PHẦN 1: KHỞI TẠO PARAMS
   */
  
  // Đã bỏ đoạn xóa URL theo yêu cầu của bro. 
  // URL giờ sẽ giữ nguyên ?extension=true để bro dễ theo dõi.

  /**
   * PHẦN 2: KHAI BÁO CÁC PHẦN TỬ UI
   */
  const installBtn = document.getElementById("install-extension-btn");
  const aiBtn = document.getElementById("ai-btn");
  const originalBtn = document.getElementById("original-ntp-btn");

  /**
   * PHẦN 3: HÀM ĐIỀU HƯỚNG (Cho Search/News/Weather)
   */
  function openAndClose(url) {
      if (isExtensionMode) {
          window.open(url, "_blank", "noopener,noreferrer");
          window.parent.postMessage("CLOSE_NEW_TAB", "*");
      } else {
          window.location.href = url;
      }
  }

  /**
   * PHẦN 4: LOGIC EXTENSION-ONLY
   */
  if (isExtensionMode) {
      // Ẩn nút cài đặt
      if (installBtn) installBtn.classList.add("hidden-ext");

      // Hiện và xử lý nút AI
      if (aiBtn) {
          aiBtn.classList.add("extension-only");
          aiBtn.addEventListener("click", () => {
              const q = input.value.trim();
              // Có nội dung → Chế độ AI với câu hỏi; trống → trang Google AI
              const url = q
                  ? "https://www.google.com/search?udm=50&q=" + encodeURIComponent(q)
                  : "https://www.google.com/ai";
              openAndClose(url);
          });
      }

      // Hiện và xử lý nút Trang gốc
      if (originalBtn) {
          originalBtn.classList.add("show-ext");
          originalBtn.addEventListener("click", () => {
              console.log("Quay về trang gốc...");
              window.parent.postMessage("OPEN_ORIGINAL_NTP", "*");
          });
      }
  }

  /**
   * PHẦN 5: GẮN SỰ KIỆN
   */
  // Submit tìm kiếm đã được xử lý ở script phía trên (doSearch)

  document.querySelectorAll(".google-news-btn, .weather-btn").forEach(btn => {
      btn.addEventListener("click", e => {
          if (isExtensionMode) {
              e.preventDefault();
              openAndClose(btn.href);
          }
      });
  });
</script>
